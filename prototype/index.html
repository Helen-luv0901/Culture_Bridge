<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culture Bridge Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef5ff;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-strong: #ffffff;
        --border: #dbe6f6;
        --border-strong: #c8d8ed;
        --text: #243248;
        --muted: #6c7a92;
        --blue: #4fb3ff;
        --blue-strong: #299cf0;
        --blue-soft: #dff1ff;
        --mint: #eaf9ef;
        --pink: #ffe9f0;
        --shadow: 0 20px 50px rgba(75, 109, 163, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(135, 197, 255, 0.26), transparent 28%),
          linear-gradient(180deg, #f8fbff 0%, #edf4ff 100%);
      }

      .page {
        width: min(1440px, calc(100% - 48px));
        margin: 0 auto;
        padding: 40px 0 72px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue-strong);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 54px);
        line-height: 1.04;
      }

      .hero p {
        max-width: 740px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
      }

      .hint {
        align-self: center;
        padding: 12px 16px;
        border: 1px solid rgba(79, 179, 255, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--blue-strong);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
      }

      .phone-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(250px, 1fr));
        gap: 22px;
      }

      .phone-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .phone-label {
        color: #6f83a1;
        font-size: 13px;
        font-style: italic;
      }

      .phone {
        position: relative;
        width: 100%;
        max-width: 280px;
        aspect-ratio: 285 / 612;
        padding: 12px;
        border-radius: 38px;
        background: linear-gradient(180deg, #1b2940 0%, #0f1828 100%);
        box-shadow: 0 28px 80px rgba(11, 21, 38, 0.32);
      }

      .phone::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 33px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        pointer-events: none;
      }

      .screen {
        position: relative;
        overflow: hidden;
        height: 100%;
        border-radius: 29px;
        border: 1px solid rgba(195, 211, 233, 0.68);
        background:
          radial-gradient(circle at top, rgba(197, 226, 255, 0.45), transparent 28%),
          linear-gradient(180deg, #fcfdff 0%, var(--bg) 100%);
      }

      .island {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 106px;
        height: 29px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #0b111a;
        z-index: 4;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 18px 0;
        font-size: 11px;
        font-weight: 700;
        color: #2b3648;
      }

      .phone-body {
        display: flex;
        flex-direction: column;
        height: calc(100% - 36px);
        padding: 8px 12px 12px;
      }

      .screen-header {
        padding: 2px 4px 0;
      }

      .brand {
        color: #8f9cb0;
        font-size: 10px;
        font-weight: 700;
      }

      .screen-title {
        margin: 2px 0 0;
        font-size: 16px;
        font-weight: 800;
      }

      .scroll-area {
        overflow: auto;
        margin-top: 8px;
        padding: 4px 2px 86px;
        scrollbar-width: none;
      }

      .scroll-area::-webkit-scrollbar {
        display: none;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 4px 14px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.88);
        color: #90a0b9;
        font-size: 11px;
      }

      .search .dot {
        width: 10px;
        height: 10px;
        border: 2px solid #b1bed2;
        border-radius: 50%;
        position: relative;
      }

      .search .dot::after {
        content: "";
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 5px;
        height: 2px;
        border-radius: 2px;
        background: #b1bed2;
        transform: rotate(45deg);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 6px 10px;
      }

      .section-head h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
      }

      .section-head a {
        color: var(--blue-strong);
        font-size: 10px;
        font-weight: 700;
        text-decoration: none;
      }

      .topic-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 24px rgba(86, 125, 173, 0.08);
      }

      .topic-card {
        padding: 13px 12px 12px;
        min-height: 112px;
      }

      .topic-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(180deg, #f5fbff 0%, #e3f1ff 100%);
        color: var(--blue-strong);
        font-size: 15px;
        font-weight: 800;
      }

      .topic-card h4,
      .video-card h4,
      .post-card h4,
      .ai-block h4 {
        margin: 12px 0 4px;
        font-size: 13px;
        font-weight: 800;
      }

      .topic-card p,
      .video-card p,
      .post-card p,
      .ai-block p,
      .reply p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }

      .video-list,
      .post-list,
      .ai-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .video-card,
      .post-card,
      .ai-panel {
        padding: 12px;
      }

      .chip-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eaf4ff;
        color: #418ad9;
        font-size: 9px;
        font-weight: 700;
      }

      .video-cover {
        position: relative;
        height: 132px;
        margin-bottom: 10px;
        border-radius: 18px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(236, 244, 255, 0.9), rgba(218, 232, 249, 0.9)),
          linear-gradient(120deg, #edf6ff 0%, #dbeaff 100%);
      }

      .video-cover::before,
      .video-cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
        background-size: 100% 26px, 28px 100%;
        opacity: 0.35;
      }

      .play {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 8px 16px rgba(37, 75, 124, 0.16);
      }

      .play::before {
        content: "";
        position: absolute;
        top: 11px;
        left: 16px;
        width: 0;
        height: 0;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 15px solid #94a9c2;
      }

      .video-time {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 4px 7px;
        border-radius: 999px;
        background: rgba(33, 48, 75, 0.75);
        color: #ffffff;
        font-size: 9px;
        font-weight: 700;
      }

      .row-between {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: start;
      }

      .save {
        flex-shrink: 0;
        padding: 4px 8px;
        border-radius: 999px;
        background: #f5f8fd;
        color: #73849d;
        font-size: 9px;
        font-weight: 700;
      }

      .meta {
        margin-top: 6px;
        color: #8f9db2;
        font-size: 9px;
      }

      .post-head {
        display: flex;
        gap: 10px;
        align-items: start;
      }

      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(180deg, #f5f8ff 0%, #e0edff 100%);
        color: #52657f;
        font-size: 14px;
        font-weight: 800;
      }

      .post-meta {
        flex: 1;
      }

      .post-meta strong {
        display: block;
        margin-bottom: 2px;
        font-size: 13px;
      }

      .school {
        color: #8f9db2;
        font-size: 10px;
        font-weight: 700;
      }

      .badge {
        padding: 4px 8px;
        border-radius: 999px;
        background: #eaf4ff;
        color: #5e91c7;
        font-size: 9px;
        font-weight: 700;
      }

      .post-body {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .translation {
        padding: 11px 10px;
        border-radius: 14px;
        background: linear-gradient(180deg, #f9fbff 0%, #eef5ff 100%);
      }

      .tag-row,
      .mini-tags {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 700;
      }

      .tag.ok {
        background: var(--mint);
        color: #4d9d65;
      }

      .tag.warn {
        background: var(--pink);
        color: #e0678a;
      }

      .translate-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #8f9db2;
        font-size: 10px;
        font-weight: 700;
      }

      .translate-link {
        color: #4d7ff2;
        cursor: pointer;
      }

      .prompt {
        align-self: flex-end;
        margin-left: 34px;
        padding: 14px 16px;
        border-radius: 18px 18px 8px 18px;
        background: linear-gradient(180deg, #37aaf7 0%, #2496ec 100%);
        color: #ffffff;
        font-size: 12px;
        line-height: 1.55;
        box-shadow: 0 14px 24px rgba(35, 130, 207, 0.24);
      }

      .ai-panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .reply {
        display: flex;
        gap: 10px;
      }

      .ai-avatar {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e5f3ff;
        color: #3298ec;
        font-size: 13px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .reply strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }

      .subtle {
        margin-top: 2px;
        color: #9babc0;
        font-size: 9px;
      }

      .recommend-block h5 {
        margin: 0 0 8px;
        font-size: 11px;
      }

      .pill-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pill {
        padding: 10px 12px;
        border-radius: 14px;
        background: linear-gradient(180deg, #eff8ff 0%, #dbeeff 100%);
        color: #5f7f9d;
        font-size: 10px;
        font-weight: 700;
      }

      .tabbar {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--border-strong);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 16px 24px rgba(91, 118, 156, 0.12);
      }

      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 48px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: #8190a8;
        cursor: pointer;
        font: inherit;
      }

      .tab:hover {
        background: rgba(232, 243, 255, 0.65);
      }

      .tab.active {
        background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
        color: var(--blue-strong);
        box-shadow: inset 0 0 0 1px rgba(84, 159, 225, 0.2);
      }

      .tab-icon {
        width: 16px;
        height: 16px;
        position: relative;
      }

      .icon-home::before,
      .icon-home::after,
      .icon-video::before,
      .icon-video::after,
      .icon-community::before,
      .icon-community::after,
      .icon-ai::before,
      .icon-ai::after {
        content: "";
        position: absolute;
      }

      .icon-home::before {
        inset: 5px 2px 1px;
        border: 2px solid currentColor;
        border-top: 0;
        border-radius: 2px;
      }

      .icon-home::after {
        left: 1px;
        right: 1px;
        top: 1px;
        height: 10px;
        border-left: 2px solid currentColor;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
        transform: rotate(45deg) scale(0.62);
        transform-origin: center;
        border-radius: 2px;
      }

      .icon-video::before {
        inset: 3px 1px 3px 1px;
        border: 2px solid currentColor;
        border-radius: 4px;
      }

      .icon-video::after {
        top: 5px;
        left: 7px;
        width: 0;
        height: 0;
        border-top: 3px solid transparent;
        border-bottom: 3px solid transparent;
        border-left: 5px solid currentColor;
      }

      .icon-community::before {
        left: 1px;
        top: 3px;
        width: 6px;
        height: 6px;
        border: 2px solid currentColor;
        border-radius: 50%;
        box-shadow: 8px 0 0 -2px currentColor;
      }

      .icon-community::after {
        left: 1px;
        bottom: 1px;
        width: 14px;
        height: 7px;
        border: 2px solid currentColor;
        border-top: 0;
        border-radius: 0 0 9px 9px;
      }

      .icon-ai::before {
        inset: 3px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .icon-ai::after {
        inset: 7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: -7px 0 0 -2px currentColor, 7px 0 0 -2px currentColor, 0 -7px 0 -2px currentColor, 0 7px 0 -2px currentColor;
      }

      .tab-label {
        font-size: 9px;
        font-weight: 800;
      }

      .screen-page {
        display: none;
      }

      .screen-page.active {
        display: block;
      }

      @media (max-width: 1180px) {
        .phone-grid {
          grid-template-columns: repeat(2, minmax(250px, 1fr));
          justify-items: center;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 24px, 520px);
          padding-top: 24px;
        }

        .hero {
          flex-direction: column;
          align-items: start;
        }

        .hint {
          white-space: normal;
        }

        .phone-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">Culture Bridge MVP Prototype</p>
          <h1>根據你原本的視覺方向，先把 4 個主分頁做成可直接打開的 HTML 原型。</h1>
          <p>
            這版先複刻你提供的設計稿語言：淺藍白底、圓角卡片、社群導向資訊架構，以及首頁、影音教學、學生社群、AI 助理四個主頁。
          </p>
        </div>
        <div class="hint">點擊每支手機底部的 tab，可切換到其他分頁。</div>
      </section>

      <section class="phone-grid" id="phone-grid"></section>
    </main>

    <script>
      const tabs = [
        { id: "home", label: "首頁", icon: "home" },
        { id: "video", label: "影音教學", icon: "video" },
        { id: "community", label: "學生社群", icon: "community" },
        { id: "ai", label: "AI 助理", icon: "ai" },
      ];

      const screens = ["home", "video", "community", "ai"];

      const phoneGrid = document.getElementById("phone-grid");

      function renderHome() {
        const topics = [
          ["航", "航班", "國際生申辦與經驗相關資訊"],
          ["交", "交通", "快速上手通勤與交通卡"],
          ["居", "居留證", "居留申請步驟與注意事項"],
          ["工", "工作證", "打工申請與工讀相關流程"],
          ["校", "校務操作", "選課、繳費、系統登入"],
        ];

        return `
          <div class="search"><span class="dot"></span><span>搜尋生活問題、制度資訊、影片教學</span></div>
          <div class="section-head"><h3>高頻主題</h3><a href="#">查看全部</a></div>
          <div class="topic-grid">
            ${topics
              .map(
                ([icon, title, desc]) => `
                  <article class="card topic-card">
                    <div class="topic-icon">${icon}</div>
                    <h4>${title}</h4>
                    <p>${desc}</p>
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderVideo() {
        const items = [
          ["居留證申請流程一次看懂", "980 次觀看", "用最少步驟說明申請流程，適合第一次接觸台灣生活資訊的國際生。", "03:20"],
          ["校務系統註冊與選課操作", "860 次觀看", "用圖像步驟說明到達校務頁，適合第一次接觸台灣生活資訊的國際生。", "01:48"],
        ];

        return `
          <div class="video-list">
            ${items
              .map(
                ([title, views, desc, time], index) => `
                  <article class="card video-card">
                    <div class="chip-row"><span class="chip">${index === 0 ? "留學資訊" : "校務操作"}</span></div>
                    <div class="video-cover"><div class="play"></div><div class="video-time">${time}</div></div>
                    <div class="row-between">
                      <div>
                        <h4>${title}</h4>
                        <div class="meta">${views}</div>
                      </div>
                      <div class="save">收藏</div>
                    </div>
                    <p>${desc}</p>
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderCommunity() {
        const posts = [
          {
            initial: "L",
            name: "Lina",
            school: "NTUST",
            badge: "交通",
            body: "I just arrived in Taipei. What is the easiest way to get from the airport to my dorm if I have a lot of luggage?",
            translation: "我剛到台北，如果我有很多行李，從機場到宿舍最方便的方式是什麼？",
            action: "Hide translation",
            count: "14 則留言",
          },
          {
            initial: "A",
            name: "An",
            school: "NCCU",
            badge: "工作證",
            body: "Do I need to get my ARC first before applying for a work permit? Can someone share the real process?",
            translation: "我需要先拿到居留證，才能申請工作證嗎？可以分享實際流程嗎？",
            action: "Translate",
            count: "11 則留言",
          },
        ];

        return `
          <div class="post-list">
            ${posts
              .map(
                (post) => `
                  <article class="card post-card">
                    <div class="post-head">
                      <div class="avatar">${post.initial}</div>
                      <div class="post-meta">
                        <strong>${post.name}</strong>
                        <div class="school">${post.school}</div>
                      </div>
                      <div class="badge">${post.badge}</div>
                    </div>
                    <div class="post-body">
                      <h4>${post.body}</h4>
                      <div class="translation"><p>${post.translation}</p></div>
                      <div class="translate-row">
                        <div class="tag-row">
                          <span class="tag ok">正確翻譯</span>
                          <span class="tag warn">提供資訊</span>
                        </div>
                        <span>${post.count}</span>
                      </div>
                      <div class="translate-row">
                        <span></span>
                        <span class="translate-link">${post.action}</span>
                      </div>
                    </div>
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderAI() {
        return `
          <div class="ai-stack">
            <div class="prompt">我想到這個學生第一次搬宿舍需要準備什麼？</div>
            <article class="card ai-panel">
              <div class="reply">
                <div class="ai-avatar">AI</div>
                <div>
                  <strong>Culture Bridge AI</strong>
                  <div class="subtle">整合社群、貼文與教學資訊</div>
                </div>
              </div>
              <div class="ai-block">
                <h4>答案摘要</h4>
                <p>一般會先確認住宿身分與房間資訊，再依照學校規定準備必帶物品。若你是中午前報到，宿舍資訊與生活物流的最新指引，避免文件不齊造成延誤。</p>
              </div>
              <div class="recommend-block">
                <h5>參考貼文</h5>
                <div class="pill-list">
                  <div class="pill">新生搬進宿舍經驗分享</div>
                  <div class="pill">工作證常見錯誤整理</div>
                </div>
              </div>
              <div class="recommend-block">
                <h5>相關影片</h5>
                <div class="pill-list">
                  <div class="pill">雙證件申請教學</div>
                  <div class="pill">居留證流程短片</div>
                </div>
              </div>
            </article>
          </div>
        `;
      }

      function pageContent(page) {
        if (page === "home") return renderHome();
        if (page === "video") return renderVideo();
        if (page === "community") return renderCommunity();
        return renderAI();
      }

      function screenTitle(page) {
        return tabs.find((tab) => tab.id === page).label;
      }

      function renderPhone(initialPage) {
        return `
          <div class="phone-shell">
            <div class="phone-label">${screenTitle(initialPage)}</div>
            <div class="phone" data-phone>
              <div class="screen">
                <div class="island"></div>
                <div class="status-bar"><span>9:41</span><span>▮▮▮ 􀛨</span></div>
                <div class="phone-body">
                  <header class="screen-header">
                    <div class="brand">Culture Bridge</div>
                    <div class="screen-title" data-title>${screenTitle(initialPage)}</div>
                  </header>
                  <div class="scroll-area">
                    ${tabs
                      .map(
                        (tab) => `
                          <section class="screen-page ${tab.id === initialPage ? "active" : ""}" data-page="${tab.id}">
                            ${pageContent(tab.id)}
                          </section>
                        `,
                      )
                      .join("")}
                  </div>
                  <nav class="tabbar">
                    ${tabs
                      .map(
                        (tab) => `
                          <button class="tab ${tab.id === initialPage ? "active" : ""}" type="button" data-tab="${tab.id}">
                            <span class="tab-icon icon-${tab.icon}"></span>
                            <span class="tab-label">${tab.label}</span>
                          </button>
                        `,
                      )
                      .join("")}
                  </nav>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      phoneGrid.innerHTML = screens.map((screen) => renderPhone(screen)).join("");

      document.querySelectorAll("[data-phone]").forEach((phone) => {
        const title = phone.querySelector("[data-title]");
        const pages = phone.querySelectorAll("[data-page]");
        const tabButtons = phone.querySelectorAll("[data-tab]");

        tabButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const nextPage = button.dataset.tab;
            title.textContent = screenTitle(nextPage);

            pages.forEach((page) => {
              page.classList.toggle("active", page.dataset.page === nextPage);
            });

            tabButtons.forEach((tabButton) => {
              tabButton.classList.toggle("active", tabButton.dataset.tab === nextPage);
            });
          });
        });
      });
    </script>
  </body>
</html>
