name: culture_bridge
description: Culture Bridge responsive Flutter frontend.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
    # NotoSerifTC (Chinese) is loaded in lib/main.dart after start-up, so the first screen does
    # not wait for its 3 MB download; see tool/subset_chinese_font.py. Every font listed here
    # is downloaded before the first frame, so list only fonts the app uses.
