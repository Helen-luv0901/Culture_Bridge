name: culture_bridge
description: Culture Bridge responsive Flutter frontend.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/fonts/
  # Listed fonts are downloaded before the first frame on the web, so text never shows as
  # boxes while a font arrives. Noto Sans TC is cut to the common Traditional Chinese
  # characters (tool/subset_chinese_font.py); rarer ones use Flutter's fallback.
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Subset.ttf
