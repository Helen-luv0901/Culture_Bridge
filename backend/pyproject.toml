[project]
name = "culture-bridge-backend"
version = "0.1.0"
description = "Culture Bridge API (FastAPI) and AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
