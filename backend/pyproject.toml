[project]
name = "culture-bridge-backend"
version = "0.1.0"
description = "Culture Bridge API (FastAPI) and AI assistant"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "google-auth>=2.30",
    "google-genai>=1.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # the test database URL must be set before app modules load
"migrations/versions/*.py" = ["E501"]  # long SQL lines
